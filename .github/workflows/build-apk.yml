name: Crear APK

on:
  workflow_dispatch:   # se ejecuta al pulsar "Run workflow"

permissions:
  contents: write      # necesario para publicar el APK como descarga

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias
        run: |
          npm install
          pip install pillow

      - name: Preparar la web
        run: |
          mkdir www
          cp -r index.html css js www/

      - name: Crear proyecto Android
        run: |
          npx cap add android
          npx cap sync android
          python3 scripts/make_icons.py

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../UniLife.apk

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: UniLife v${{ github.run_number }}
          files: UniLife.apk
          make_latest: true
